name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend · Lint, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nigefa
          POSTGRES_PASSWORD: nigefa
          POSTGRES_DB: nigefa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nigefa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit-Tests
        run: npm run test
      - name: Integrationstests (PostgreSQL)
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: nigefa
          DB_PASSWORD: nigefa
          DB_NAME: nigefa_test
          DB_SYNCHRONIZE: "true"
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          SCHEDULER_ENABLED: "false"
          SMTP_HOST: ""

  frontend:
    name: Frontend · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  docker:
    name: Docker-Images bauen (+ Push auf main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR (nur main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Namen ableiten
        id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Backend-Image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.repo }}-backend:latest
            ${{ steps.meta.outputs.repo }}-backend:${{ github.sha }}
      - name: Frontend-Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ${{ steps.meta.outputs.repo }}-frontend:latest
            ${{ steps.meta.outputs.repo }}-frontend:${{ github.sha }}

  # Optionales Continuous Deployment — Secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY
